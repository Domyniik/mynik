name: Mynik
options:
  bundleIdPrefix: com.domynik
  developmentLanguage: pt-PT
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    # App Group partilhado com os widgets. No Mac (sem perfil de provisionamento,
    # fora da App Store) tem de começar pelo Team ID; no iOS usa o formato "group.".
    DEVELOPMENT_TEAM: CJ7Y2P3TKF
    MYNIK_APP_GROUP: group.com.domynik.mynik
    "MYNIK_APP_GROUP[sdk=macosx*]": $(TeamIdentifierPrefix)com.domynik.mynik
    # Mac: assinado com o certificado Apple Development (Personal Team), sem
    # perfil, para o App Group ser aceite. iOS: assinatura automática.
    "CODE_SIGN_STYLE[sdk=macosx*]": Manual
    "CODE_SIGN_IDENTITY[sdk=macosx*]": Apple Development
  configs:
    Release:
      # Sem get-task-allow na versão publicada (o certificado é de desenvolvimento).
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
targets:
  Mynik:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Mynik
        excludes:
          - "Widgets/**"
    dependencies:
      - target: MynikWidgets
    entitlements:
      path: Mynik/Resources/Mynik.entitlements
      properties:
        # Partilha o resumo dos widgets (WidgetSnapshot) com a extensão.
        com.apple.security.application-groups: [$(MYNIK_APP_GROUP)]
    info:
      path: Mynik/Resources/Info.plist
      properties:
        # Atualização da loja em segundo plano (notificações de venda).
        BGTaskSchedulerPermittedIdentifiers: [com.domynik.mynik.store-refresh]
        UIBackgroundModes: [fetch]
        # A versão vem das definições de compilação (o release.sh define MARKETING_VERSION).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        MynikAppGroup: $(MYNIK_APP_GROUP)
        # A API de preços de combustível do Ministerio só aceita TLS 1.2 sem forward secrecy.
        NSAppTransportSecurity:
          NSExceptionDomains:
            sedeaplicaciones.minetur.gob.es:
              NSExceptionRequiresForwardSecrecy: false
        # Fotos e números dos documentos.
        NSFaceIDUsageDescription: O Mynik usa o Face ID para proteger os números e as fotos dos teus documentos.
        # Preços de combustível perto do utilizador (a localização não sai do dispositivo).
        NSLocationWhenInUseUsageDescription: O Mynik usa a tua localização para mostrar os postos de combustível mais baratos perto de ti. A localização não sai do dispositivo.
        # Eventos e lembretes de hoje na tela Hoje (lidos no dispositivo).
        NSCalendarsFullAccessUsageDescription: O Mynik mostra os eventos de hoje na tela Hoje. Os dados do calendário não saem do dispositivo.
        NSRemindersFullAccessUsageDescription: O Mynik mostra os lembretes de hoje na tela Hoje e deixa marcá-los como feitos. Os dados não saem do dispositivo.
        NSLocationUsageDescription: O Mynik usa a tua localização para mostrar os postos de combustível mais baratos perto de ti. A localização não sai do dispositivo.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.domynik.mynik
        PRODUCT_NAME: Mynik
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Mynik
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_RESOURCE_ACCESS_LOCATION: YES
        ENABLE_RESOURCE_ACCESS_CALENDARS: YES
        ENABLE_USER_SELECTED_FILES: readwrite
        ENABLE_PREVIEWS: YES
  MynikWidgets:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Mynik/Widgets
      # Código partilhado com a app (sem SwiftData).
      - path: Mynik/Core/Shared
      - path: Mynik/Core/Utils/Currency.swift
      - path: Mynik/Core/Utils/Locale+App.swift
      - path: Mynik/Features/Today/DueDateText.swift
    info:
      path: Mynik/Widgets/Info.plist
      properties:
        CFBundleDisplayName: Mynik
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        MynikAppGroup: $(MYNIK_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Mynik/Widgets/MynikWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(MYNIK_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.domynik.mynik.widgets
        PRODUCT_NAME: MynikWidgets
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
  MynikTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: MynikTests
    dependencies:
      - target: Mynik
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.domynik.mynik.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Mynik.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Mynik"
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/Mynik.app/Contents/MacOS/Mynik"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Mynik:
    build:
      targets:
        Mynik: all
        MynikTests: [test]
    test:
      targets:
        - MynikTests
